name: per bird label check

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas rasterio
      - run: python 01_download_data.py
      - run: python 02_prepare_features.py
      - run: python -c "import pandas as pd; d=pd.read_csv('data/processed/curlew_ml_table.csv'); print(d.groupby('bird_id')['active_movement'].agg(['count','sum','mean']).to_string())"
