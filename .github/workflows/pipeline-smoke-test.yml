name: threshold check

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas rasterio
      - run: python 01_download_data.py
      - run: python 02_prepare_features.py
      - run: cat data/processed/movement_threshold_sensitivity.csv
